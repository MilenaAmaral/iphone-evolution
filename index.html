<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#0b0b0d" />

    <meta
      name="description"
      content="iPhone Evolution: experiência visual interativa sobre a evolução do iPhone, com modelos 3D, animações e navegação por scroll."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!--
      Open Graph / Twitter Card:
      configurações usadas para definir como o projeto aparece quando
      o link é compartilhado em redes sociais e aplicativos como
      WhatsApp, LinkedIn e X.

      Como o projeto ainda não possui um domínio definitivo, as imagens
      estão usando os caminhos locais. Depois da publicação, posso
      adicionar as URLs absolutas e o canonical da página.
    -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="iPhone Evolution" />

    <meta
      property="og:title"
      content="iPhone Evolution | Uma evolução em 3D"
    />

    <meta
      property="og:description"
      content="Experiência visual interativa sobre a evolução do iPhone, com modelos 3D, animações e navegação por scroll."
    />

    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter / X -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="iPhone Evolution | Uma evolução em 3D"
    />

    <meta
      name="twitter:description"
      content="Experiência visual interativa sobre a evolução do iPhone, com modelos 3D, animações e navegação por scroll."
    />

    <meta
      name="twitter:image"
      content="/og-image.png"
    />

    <title>iPhone Evolution | Experiência 3D</title>

    <!--
      Loader inicial.

      O projeto utiliza React, Three.js e GSAP, então existe um pequeno
      intervalo enquanto o JavaScript da aplicação é carregado.

      Optei por deixar o loader diretamente no HTML e CSS para que ele
      apareça mesmo antes do React ser inicializado.

      O loader é removido pelo React depois que a aplicação é carregada.
      A lógica fica no main.jsx.
    -->

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0d;
        z-index: 9999;
      }

      #initial-loader__spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid rgba(216, 178, 107, 0.25);
        border-top-color: #d8b26b;
        animation: initial-loader-spin 0.8s linear infinite;
      }

      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loader__spinner {
          animation: none;
        }
      }
    </style>

    <!--
      Dados estruturados do projeto.

      Estou usando CreativeWork porque este é um projeto independente
      de portfólio. Também deixo explícito que o projeto não possui
      afiliação, endosso ou patrocínio da Apple Inc.
    -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CreativeWork",
        "name": "iPhone Evolution",
        "description": "Experiência visual interativa sobre a evolução do iPhone, com modelos 3D, animações e navegação por scroll. Projeto independente, não afiliado, endossado ou patrocinado pela Apple Inc.",
        "inLanguage": "pt-BR"
      }
    </script>
  </head>

  <body>
    <div id="root">
      <div
        id="initial-loader"
        aria-hidden="true"
      >
        <span id="initial-loader__spinner"></span>
      </div>
    </div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
